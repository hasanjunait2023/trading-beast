function matchedPairs(){
 const query=ui.query.trim().toLowerCase();
 return pairs.filter(p=>(ui.filter==='All'||p.tag===ui.filter)&&(ui.scope!=='Watchlist'||ui.watch.includes(p.id))&&[p.id,p.name,p.desc,p.kind].some(v=>v.toLowerCase().includes(query))).sort((a,b)=>(b.score??-1)-(a.score??-1));
}
function matrix(labels,seed){
 const n=seed.split('').reduce((sum,c)=>sum+c.charCodeAt(0),0);
 return '<div class="tablewrap"><table class="heat"><thead><tr><th scope="col">—</th>'+labels.map(l=>'<th scope="col">'+l+'</th>').join('')+'</tr></thead><tbody>'+labels.map((label,i)=>'<tr><th scope="row">'+label+'</th>'+labels.map((_,j)=>{
   const v=i===j?1:((Math.min(i,j)*71+Math.max(i,j)*41+n)%151-75)/100;
   return '<td class="'+(v>.25?'pos':v<-.25?'neg':'')+'">'+v.toFixed(2)+'</td>';
 }).join('')+'</tr>').join('')+'</tbody></table></div>';
}

function selected(id,page,bottom=false) {
 if(id===page)return true;
 if(id==='markets'&&['pair','run','strength','correlations'].includes(page))return true;
 if(id==='journal'&&page==='trade')return true;
 if(id==='alerts'&&page==='alert-editor')return true;
 if(id==='membership'&&['payments','checkout','payment-submitted'].includes(page))return true;
 if(bottom&&id==='more'&&!['home','markets','pair','run','strength','correlations','plan','journal','trade'].includes(page))return true;
 return false;
}
function navItem([id,label],page,bottom=false){const active=selected(id,page,bottom);return '<a class="navitem'+(active?' active':'')+'" '+(active?'aria-current="page" ':'')+'href="#'+id+'">'+ico(routeMap[id][2])+e(label)+'</a>';}

 const entry=['welcome','login','setup'].includes(page);
 const expired=ui.state==='Session expired'&&!entry&&!['review','missing'].includes(page);
 const pair=page==='pair'?(pairs.find(p=>p.id===arg)||pairs[0]):null;
 const title=pair?pair.name+' · Evidence':routeMap[page][1];
 const subtitle=pair?pair.desc+' · '+ui.session+' sample session':subtitles[page];
 const ctas={markets:button('Run Radar','run','primary','radar'),journal:button('Add trade','trade','primary','plus'),alerts:button('Create alert','alert-editor','primary','plus')};
 const top='<div class="top">'+brand()+'<div class="top-context">'+ico(telegram?'telegram':'radar')+(telegram?'Telegram workspace':'Trading workspace')+'</div><div class="top-tools"><a class="pill neutral" aria-label="Open demo screen index" href="#review">Demo</a>'+(entry?'':'<a class="pill focus" aria-label="Open Radar credits" href="#credits">'+ico('bolt')+ui.balance+' credits</a>')+'<a class="avatar" aria-label="Settings" href="#settings">DT</a></div></div>';
 const content='<main id="main" class="content">'+(page==='welcome'?'':heading(page,title,subtitle,expired?'':ctas[page]))+(expired?panel('Reconnect',blank('Session expired','Return to the sign-in preview to reconnect.',button('Sign in','login','primary'),'lock')):pages[page](arg))+'</main>';
 const sidebar='<aside class="side">'+brand()+'<nav aria-label="Workspace navigation">'+navGroups.map(([label,links])=>'<div class="navgroup"><p class="navlabel">'+label+'</p>'+links.map(l=>navItem(l,page)).join('')+'</div>').join('')+'</nav><div class="side-foot">'+navItem(['review','Screen index'],page)+'</div></aside>';
 const bottom='<nav class="bottom" aria-label="Mobile navigation">'+bottomNav.map(l=>navItem(l,page,true)).join('')+'</nav>';
 q('root').innerHTML=entry?'<div class="plain">'+top+content+'</div>':'<div class="app">'+sidebar+'<div class="maincol">'+top+content+'</div>'+bottom+'</div>';
 document.documentElement.dataset.host=telegram?'telegram':'web';
 document.documentElement.dataset.theme=ui.theme;
 document.title=title+' · TradingBeast';
 if(scroll)window.scrollTo(0,0);
 requestAnimationFrame(drawCharts);
}
function drawCharts(){
 document.querySelectorAll('canvas[data-chart]').forEach(canvasEl=>{
   const w=canvasEl.clientWidth,h=canvasEl.clientHeight;
   if(!w||!h)return;
   const dpr=Math.min(window.devicePixelRatio||1,2);
   canvasEl.width=w*dpr;canvasEl.height=h*dpr;
   const ctx=canvasEl.getContext('2d');ctx.scale(dpr,dpr);
   const dark=ui.theme==='dark';
   const seed=canvasEl.dataset.seed.split('').reduce((a,c)=>a*31+c.charCodeAt(0),7);
   const f=(i,k)=>{const n=Math.sin((i+seed%107)*12.9898+k*78.233)*43758.5453;return n-Math.floor(n);};
   if(canvasEl.dataset.chart==='spark'){
     ctx.beginPath();
     for(let i=0;i<20;i++){const x=1+(w-3)*i/19;const y=h*(.73-i*.022+f(i,3)*.23);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}
     ctx.strokeStyle=dark?'#85dbae':'#168369';ctx.lineWidth=1.5;ctx.stroke();return;
   }
   const l=18,r=w-64,t=22,b=h-27, chartColor=dark?'#2f453c':'#e6eee9';
   ctx.font='11px system-ui';ctx.strokeStyle=chartColor;ctx.fillStyle=dark?'#b0c6bc':'#526b63';ctx.lineWidth=1;
   const p=pairs.find(pair=>canvasEl.dataset.seed.startsWith(pair.id));
   const base=Number((p?.price||'1.08642').replaceAll(',',''))||1;
   const step=base<2?.001:base<200?.3:4;
   for(let i=0;i<=5;i++){const y=t+(b-t)*i/5;ctx.beginPath();ctx.moveTo(l,y);ctx.lineTo(r,y);ctx.stroke();ctx.fillText((base+step*(2-i)).toFixed(base<2?4:2),r+7,y+4);}
   ['09:00','11:00','13:00','15:00','17:00'].forEach((time,i)=>{const x=l+(r-l)*i/4;ctx.beginPath();ctx.moveTo(x,t);ctx.lineTo(x,b);ctx.stroke();ctx.fillText(time,Math.max(l,x-15),b+17);});
   const count=Math.floor((r-l)/(w<430?8:12));
   const dx=(r-l)/count;
   const sy=v=>t+(b-t)*(1-v);
   for(let i=0;i<count;i++){
     const open=.3+i/count*.26 + Math.sin(i*.35)*.11+(f(i,2)-.5)*.085;
     const close=open+(f(i,5)-.46)*.15;
     const x=l+dx*(i+.5), color=close>=open?'#219b72':'#cf6f78';
     ctx.fillStyle=color;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(x,sy(Math.max(open,close)+f(i,7)*.115));ctx.lineTo(x,sy(Math.min(open,close)-f(i,8)*.11));ctx.stroke();ctx.fillRect(x-dx*.27,Math.min(sy(open),sy(close)),dx*.54,Math.max(2,Math.abs(sy(close)-sy(open))));
   }
   ctx.setLineDash([5,4]);ctx.strokeStyle=dark?'#91ba85':'#8cae83';ctx.beginPath();ctx.moveTo(l,sy(.48));ctx.lineTo(r,sy(.48));ctx.stroke();ctx.setLineDash([]);
 });
}
let toastTimer;
function say(text){q('toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{q('toast').textContent='';},2600);}
function persist(key){cache.set(key,ui[key]);}
function refreshMarket(){if(q('market-results'))q('market-results').innerHTML=radarContent(matchedPairs());requestAnimationFrame(drawCharts);}
document.addEventListener('click',event=>{
 const control=event.target.closest('button[data-set],button[data-action]');
 if(!control)return;
 if(control.dataset.set){ui[control.dataset.set]=control.dataset.value;render();return;}
 const [name,arg]=control.dataset.action.split(':');
 if(name==='reset-filters'){ui.filter='All';ui.query='';ui.scope='All instruments';render();}
 if(name==='restore'){ui.state='Sample';render();}
 if(name==='edit-watch'){ui.watchEditing=!ui.watchEditing;render();}
 if(name==='watch'){ui.watch=ui.watch.includes(arg)?ui.watch.filter(id=>id!==arg):[...ui.watch,arg];persist('watch');render();say('Demo watchlist saved.');}
 if(name==='move'){const i=ui.watch.indexOf(arg);if(i>0){[ui.watch[i-1],ui.watch[i]]=[ui.watch[i],ui.watch[i-1]];persist('watch');render();}}
 if(name==='toggle-alert'){const alert=ui.alerts[Number(arg)];alert.on=!alert.on;persist('alerts');render();say('Demo rule updated.');}
 if(name==='choose'){ui.paymentPlan=arg;location.hash='checkout';}
 if(name==='copy'){
   if(navigator.clipboard){navigator.clipboard.writeText('BEAST-DEMO').then(()=>say('Demo code copied.'),()=>say('Demo code: BEAST-DEMO'));}
   else say('Demo code: BEAST-DEMO');
 }
 if(name==='reset'){
   ['prefs','watch','balance','plan','alerts','trades','payments','theme'].forEach(key=>{try{localStorage.removeItem('tb-design-'+key);}catch{}});
   location.replace(location.pathname+'?host='+(telegram?'telegram':'web')+'#review');
 }
 if(name==='run'&&!ui.running&&ui.balance>=10){
   ui.running=true;render();
   setTimeout(()=>{
     ui.running=false;
     if(ui.state==='Error'){render();say('Sample scan failed. Balance retained.');return;}
     ui.balance-=10;persist('balance');
     if(ui.state==='Empty')ui.state='Sample';
     location.hash='markets';say('Sample scan complete. 10 demo credits used.');
   },550);
 }
});
document.addEventListener('change',event=>{
 const {name,value}=event.target;
 if(event.target.closest('form'))return;
 if(['session','scope','eventCurrency','impact','state'].includes(name)){ui[name]=value;render();}
});
document.addEventListener('input',event=>{
 const {name,value}=event.target;
 if(name==='query'){ui.query=value;refreshMarket();}
 if(name==='faq'){ui.faq=value;q('faq-results').innerHTML=renderFaq();}
});
document.addEventListener('submit',event=>{
 const target=event.target;
 if(!target.dataset.form)return;
 event.preventDefault();
 const data=Object.fromEntries(new FormData(target));
 const [,arg]=getRoute();
 switch(target.dataset.form){
 case 'login': location.hash='setup';break;
 case 'setup':
   ui.watch=pairs.filter(p=>data['watch-'+p.id]).map(p=>p.id);persist('watch');
   ui.prefs={zone:data.zone,session:data.session};ui.session=data.session;persist('prefs');location.hash='home';break;
 case 'plan': ui.plan={...data,saved:true};persist('plan');render();say('Demo plan saved.');break;
 case 'trade': {
   if(arg!=='')ui.trades[Number(arg)]=data;else ui.trades.unshift(data);
   persist('trades');location.hash='journal';say('Demo trade saved.');break;
 }
 case 'alert':ui.alerts.push({symbol:data.symbol,rule:data.rule,on:Boolean(data.on)});persist('alerts');location.hash='alerts';say('Demo alert saved.');break;
 case 'settings':
   ui.prefs={zone:data.zone,session:data.session};ui.session=data.session;ui.theme=data.theme;persist('prefs');persist('theme');render();say('Preferences saved in this browser.');break;
 case 'checkout':
   ui.payments.unshift({plan:ui.paymentPlan,method:data.method,amount:ui.paymentPlan==='Elite'?'৳1,450':'৳750',date:'Demo submission',status:'Pending'});
   persist('payments');location.hash='payment-submitted';break;
 case 'risk':{
   const n=Object.fromEntries(Object.entries(data).map(([key,v])=>[key,Number(v)]));
   let result,unit;
   if(ui.rule==='Position size'){result=n.equity*n.risk/100/n.stop/n.pip;unit='lots';}
   if(ui.rule==='Pip value'){result=n.lot*n.contract*n.pip*n.fx;unit='account currency / pip';}
   if(ui.rule==='Risk / reward'){result=n.target/n.stop;unit='reward per unit risk';}
   if(ui.rule==='Margin'){result=n.notional/n.leverage;unit='USD';}
   if(ui.rule==='Recovery'){result=n.loss/(100-n.loss)*100;unit='% required gain';}
   q('risk-result').innerHTML=Number.isFinite(result)?metric(ui.rule,result.toFixed(2),unit):banner('Result unavailable for those inputs.','warn');
   break;
 }
 }
});
