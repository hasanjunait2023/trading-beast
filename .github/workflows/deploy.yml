name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 72.62.228.196
  VPS_USER: root
  PROJECT_DIR: /opt/session-focus-radar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'SSHEOF'
            cd ${{ env.PROJECT_DIR }}

            # Pull latest changes
            git pull origin main

            # Build and deploy backend
            docker compose build backend
            docker compose up -d backend

            # Build and deploy user frontend
            docker compose build user-frontend
            docker compose up -d user-frontend

            # Build and deploy admin frontend
            docker compose build admin-frontend
            docker compose up -d admin-frontend

            # Run migrations
            docker exec sfr-backend npx prisma migrate deploy

            # Clean up old images
            docker image prune -f

            # Show status
            docker ps --filter name=sfr- --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          SSHEOF