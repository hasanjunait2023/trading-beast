version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sfr-postgres
    environment:
      POSTGRES_DB: session_focus_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sfr-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  quickchart:
    image: ianw/quickchart:latest
    container_name: sfr-quickchart
    environment:
      - QC_WIDTH=1200
      - QC_HEIGHT=850
    restart: unless-stopped
    networks:
      - sfr-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: sfr-backend
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/session_focus_radar?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET}
      - TELEGRAM_MINI_APP_URL=${TELEGRAM_MINI_APP_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL}
      - PORT=3000
      - NODE_ENV=production
      - QUICKCHART_URL=http://quickchart:3400
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY}
      - ENABLE_CRYPTO=${ENABLE_CRYPTO:-false}
      - ENABLE_REFERRALS=${ENABLE_REFERRALS:-true}
      - ENABLE_DAILY_PUBLISHING=${ENABLE_DAILY_PUBLISHING:-true}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      quickchart:
        condition: service_started
    restart: unless-stopped
    networks:
      - sfr-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  user-frontend:
    build:
      context: ./frontend/user-portal
      dockerfile: Dockerfile.prod
    container_name: sfr-user-frontend
    environment:
      - VITE_API_URL=${FRONTEND_URL}/api
      - VITE_TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sfr-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  admin-frontend:
    build:
      context: ./frontend/admin-portal
      dockerfile: Dockerfile.prod
    container_name: sfr-admin-frontend
    environment:
      - VITE_API_URL=${ADMIN_FRONTEND_URL}/api
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sfr-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  postgres_data:

networks:
  sfr-network:
    driver: bridge